        font-size: 132px;
        fill: #ffffff;
      }
      .caps {
        font-family: 'Montserrat', 'Nunito', Arial, sans-serif;
        font-weight: 700;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Horizontal badge with top notch (matches kraft bag) -->
