       C624 56 648 72 648 96
       L648 268
       C648 300 624 328 592 340
       L400 388
       C376 396 344 396 320 388
       L128 340
       C96 328 72 300 72 268
       Z"
  />
  <path
    fill="none"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linejoin="round"
    d="M92 104
       C92 84 110 72 136 72
       L298 72
       C314 72 324 62 332 48
       C340 34 350 26 360 26
       C370 26 380 34 388 48
       C396 62 406 72 422 72
       L584 72
       C610 72 628 84 628 104
       L628 262
       C628 288 608 310 580 320
       L396 366
       C376 374 344 374 324 366
       L140 320
       C112 310 92 288 92 262
       Z"
  />

  <!-- Dala-style horse mark in top notch -->
  <g transform="translate(360 58)" fill="#ffffff">
    <path d="M-22 2
      c0-10 6-18 16-20 4-1 8 0 11 2
      2-4 7-7 12-6 7 1 11 7 11 14
      0 3-1 6-3 8h2c4 0 7 3 7 7
      0 3-2 5-5 5h-4
      c-1 7-6 12-14 14
      -9 2-18-1-22-8
      -2-3-2-7 0-10z"/>
    <ellipse cx="-8" cy="4" rx="5" ry="3.5" fill="#5A3A9A"/>
    <path d="M-4 6h14c2.5 0 4.5 2 4.5 4.5v5c0 2-1.5 3.5-3.5 3.5h-16c-2 0-3.5-1.5-3.5-3.5v-5c0-2.5 2-4.5 4.5-4.5z"/>
    <circle cx="14" cy="-8" r="1.8"/>
  </g>

  <!-- ALL NATURAL stacked upper-right (as on bag) -->
  <g class="caps" font-size="13" letter-spacing="0.18em" text-anchor="middle">
